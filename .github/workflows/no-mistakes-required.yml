name: Repo-native PR validation

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: repo-native-pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Repo-native tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run docs:test
      - run: pnpm run docs:check
      - run: pnpm run lint
      - run: pnpm --dir packages/axi-sdk-js run build
      - run: pnpm --dir packages/axi-sdk-js test
      - run: pnpm --dir bench-github run build
      - run: pnpm --dir bench-github test
      - run: pnpm --dir bench-browser run build
      - run: pnpm --dir bench-browser test
