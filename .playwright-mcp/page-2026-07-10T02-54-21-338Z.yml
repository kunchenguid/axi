  - generic [ref=e268]:
    - paragraph [ref=e269]: Premise
    - heading "Neither CLI nor MCP gives [agents] enough love." [level=2] [ref=e270]
    - paragraph [ref=e271]:
      - text: AI agents interact with external services through two dominant paradigms. The first is
      - strong [ref=e272]: shell-based CLI execution
      - text: ": the agent runs commands like"
      - code [ref=e273]: gh issue list
      - text: or
      - code [ref=e274]: agent-browser navigate
      - text: and parses the text output. The second is
      - strong [ref=e275]: structured tool protocols
      - text: like MCP (Model Context Protocol), where the agent invokes typed tool functions through the hosting framework’s native tool-calling interface.
    - paragraph [ref=e276]: "Both approaches have significant problems for agents:"
    - list [ref=e277]:
      - listitem [ref=e278]:
        - strong [ref=e279]: "CLI: action and observation are separated."
        - text: Browser CLIs return minimal confirmations —
        - code [ref=e280]: navigate
        - text: returns only a page title,
        - code [ref=e281]: click
        - text: returns “Done” — forcing the agent to call
        - code [ref=e282]: snapshot
        - text: after every action. This doubles tool calls and wastes token budget.
      - listitem [ref=e283]:
        - strong [ref=e284]: "MCP: schema overhead scales with tool count."
        - text: A browser MCP server exposes ~30 tools. Their schemas inflate input tokens — MCP conditions average 185K tokens per task vs. 79K for AXI — and the overhead compounds across every turn.
      - listitem [ref=e285]:
        - strong [ref=e286]: "Both: poor discoverability."
        - text: CLI agents must guess subcommands or read
        - code [ref=e287]: "--help"
        - text: . MCP agents with lazy loading guess wrong tool names — selecting
        - code [ref=e288]: take_screenshot
        - text: (1MB base64 PNG) instead of
        - code [ref=e289]: take_snapshot
        - text: (80KB text) — and crash the session. Neither provides in-context guidance on what to do next.
    - paragraph [ref=e290]:
      - text: Recent debate has framed this as “MCP vs. CLI”
      - link "[2]" [ref=e291] [cursor=pointer]:
        - /url: "#ref-smithery"
      - text: ", but the real question is neither"
      - emphasis [ref=e292]: which
      - text: protocol nor
      - emphasis [ref=e293]: which
      - text: transport, but rather
      - emphasis [ref=e294]: what design principles
      - text: make an agent-tool interface effective.
    - paragraph [ref=e295]:
      - text: AXI is
      - strong [ref=e296]: 10 principles for agent-ergonomic CLI design
      - text: that treat token budget as a first-class constraint. AXI achieves the reliability advantages MCP promises (structured output, discoverability) at the cost profile of a CLI.
    - separator [ref=e297]
    - heading "Contributions" [level=3] [ref=e298]
    - list [ref=e299]:
      - listitem [ref=e300]: Ten design principles for agent-ergonomic CLI tools, organized into four categories.
      - listitem [ref=e301]:
        - text: Reference implementations (
        - link [ref=e302] [cursor=pointer]:
          - /url: https://github.com/kunchenguid/gh-axi
          - code [ref=e303]: gh-axi
        - text: for GitHub,
        - link [ref=e304] [cursor=pointer]:
          - /url: https://github.com/kunchenguid/chrome-devtools-axi
          - code [ref=e305]: chrome-devtools-axi
        - text: for browser automation) demonstrating the principles across two domains.
      - listitem [ref=e306]:
        - text: Two benchmarks — 490 browser automation runs and
        - link "425 GitHub API runs" [ref=e307] [cursor=pointer]:
          - /url: https://github.com/kunchenguid/axi/blob/main/bench-github/published-results/STUDY.md
        - text: — comparing seven interface conditions each, with trajectory-level analysis showing where and why each interface succeeds or fails.
  - generic [ref=e308]:
    - paragraph [ref=e309]: Context
    - heading "Related Work" [level=2] [ref=e310]
    - heading "Model Context Protocol (MCP)" [level=4] [ref=e311]
    - paragraph [ref=e312]:
      - text: Anthropic’s Model Context Protocol
      - link "[1]" [ref=e313] [cursor=pointer]:
        - /url: "#ref-mcp"
      - text: "provides a standardized way to connect AI models to external tools through structured, typed tool definitions. While MCP offers type-safe schemas and discoverable tool catalogs, the schema overhead is substantial. The evaluation below quantifies this cost: MCP conditions use 2.3× more input tokens than AXI (185K vs. 79K per task), and the overhead compounds across multi-step tasks."
    - heading "MCP vs. CLI benchmarks" [level=4] [ref=e314]
    - paragraph [ref=e315]:
      - text: Mao and Pradhan
      - link "[2]" [ref=e316] [cursor=pointer]:
        - /url: "#ref-smithery"
      - text: "benchmarked 756 runs comparing raw APIs, CLI, and native MCP across GitHub, Linear, and Singapore Bus APIs. They found native MCP achieved 91.7% success vs. 83.3% for CLI, with CLI using 2.9× more billed tokens. However, their CLI was auto-generated from API specs, not hand-designed for agents. They note: “What this does not settle is whether a hand-crafted, agent-first CLI could close the remaining gap.” AXI answers this question directly — an agent-first CLI not only closes the gap but surpasses MCP on every metric."
    - heading "Code execution with MCP" [level=4] [ref=e317]
    - paragraph [ref=e318]:
      - text: Jones and Kelly
      - link "[3]" [ref=e319] [cursor=pointer]:
        - /url: "#ref-anthropic-code"
      - text: "identified two scaling problems with direct MCP tool calls: tool definitions overload the context window, and intermediate results consume additional tokens as they pass through the model between calls. They proposed presenting MCP tools as a code API that the agent programs against, so that data flows through the execution environment rather than the context window. Varda and Pai"
      - link "[4]" [ref=e320] [cursor=pointer]:
        - /url: "#ref-cloudflare-code"
      - text: independently arrived at the same insight, coining the term “Code Mode” and reporting that LLMs handle complex, multi-step tool interactions better when writing TypeScript than when making direct tool calls. The code-mode condition in our browser benchmark evaluates this approach. Code execution achieves 100% reliability, but write-run-debug loops make it the slowest condition (36.2s avg) and, at $0.120/task, the most expensive condition. In a
      - link "separate GitHub benchmark" [ref=e321] [cursor=pointer]:
        - /url: https://github.com/kunchenguid/axi/blob/main/bench-github/published-results/STUDY.md
      - text: ", code mode was the cheapest MCP condition ($0.101/task) by batching API calls — suggesting the trade-off is domain-dependent."
  - generic [ref=e322]:
    - paragraph [ref=e323]: The Model
    - heading "The [10 principles]." [level=2] [ref=e324]
    - list [ref=e326]:
      - listitem [ref=e327]:
        - strong [ref=e328]: Token-efficient output
        - text: — Use TOON format for ~40% token savings over JSON
      - listitem [ref=e329]:
        - strong [ref=e330]: Minimal default schemas
        - text: — 3–4 fields per list item, not 10+
      - listitem [ref=e331]:
        - strong [ref=e332]: Content truncation
        - text: — Truncate large text fields with size hints and escape hatches
      - listitem [ref=e333]:
        - strong [ref=e334]: Pre-computed aggregates
        - text: — Include aggregated counts and statuses that eliminate round trips
      - listitem [ref=e335]:
        - strong [ref=e336]: Definitive empty states
        - text: — Explicit “0 results” rather than ambiguous empty output
      - listitem [ref=e337]:
        - strong [ref=e338]: Structured errors & exit codes
        - text: — Idempotent mutations, structured errors, no interactive prompts, fail loud on unknown flags
      - listitem [ref=e339]:
        - strong [ref=e340]: Ambient context
        - text: — Install opt-in session integrations first, then offer an on-demand skill
      - listitem [ref=e341]:
        - strong [ref=e342]: Content first
        - text: — Prefer showing actual data, not a wall of help text
      - listitem [ref=e343]:
        - strong [ref=e344]: Contextual disclosure
        - text: — Append relevant next-step commands after output, not all upfront
      - listitem [ref=e345]:
        - strong [ref=e346]: Consistent way to get help
        - text: — Concise per-subcommand reference for when agents need it
    - heading "Efficiency" [level=3] [ref=e347]
    - heading "1. Token-efficient output" [level=4] [ref=e348]
    - paragraph [ref=e349]: Use TOON (Token-Optimized Object Notation) format instead of JSON or tab-separated tables. TOON omits braces, quotes, and commas, yielding approximately 40% token savings over equivalent JSON while remaining unambiguous to LLMs.
    - generic [ref=e350]:
      - generic [ref=e351]:
        - paragraph [ref=e352]: Conventional (JSON)
        - code [ref=e354]: "[{\"number\":42,\"title\":\"Fix login bug\",\"state\":\"open\", \"author\":\"alice\",\"labels\":[\"bug\",\"P1\"]}, {\"number\":43,\"title\":\"Add dark mode\",\"state\":\"open\", \"author\":\"bob\",\"labels\":[\"feature\"]}]"
      - generic [ref=e355]:
        - paragraph [ref=e356]: AXI (TOON)
        - code [ref=e358]: "issues[2]{number,title,state}: 42,Fix login bug,open 43,Add dark mode,open"
    - heading "2. Minimal default schemas" [level=4] [ref=e359]
    - paragraph [ref=e360]:
      - text: Return 3–4 fields per list item by default, not 10+. Agents rarely need all available fields and can request additional ones explicitly via a
      - code [ref=e361]: "--fields"
      - text: flag.
    - heading "3. Content truncation" [level=4] [ref=e362]
    - paragraph [ref=e363]:
      - text: Truncate large text fields to a configurable limit, appending a size hint such as
      - code [ref=e364]: (truncated, 2847 chars total — use --full to see complete body)
      - text: . This prevents a single verbose response from consuming the agent’s context budget while preserving enough content for most tasks.
    - separator [ref=e365]
    - heading "Robustness" [level=3] [ref=e366]
    - heading "4. Pre-computed aggregates" [level=4] [ref=e367]
    - paragraph [ref=e368]:
      - text: Include aggregate or derived fields that eliminate round trips. The most impactful example is
      - code [ref=e369]: totalCount
      - text: ": always report the total number of items, not just the page size. Other examples include computed CI status summaries (e.g., “27 passed, 0 failed, 10 skipped”) inline in PR views."
    - generic [ref=e370]:
      - generic [ref=e371]:
        - paragraph [ref=e372]: "Conventional: no total count"
        - code [ref=e374]: "$ gh label list bug Something isn't working #d73a4a docs Improvements or additions #0075ca ... (30 rows -- default page, no total)"
      - generic [ref=e375]:
        - paragraph [ref=e376]: "AXI: total count + CI pre-computed"
        - code [ref=e378]: "$ gh-axi label list count: 126 labels[126]{name}: bug docs ... $ gh-axi pr view 51772 pull_request: title: \"refactor(plugins): route...\" state: merged checks: \"27 passed, 0 failed, 10 skipped\""
    - heading "5. Definitive empty states" [level=4] [ref=e379]
    - paragraph [ref=e380]: When a query returns no results, output an explicit zero-result message rather than empty output. Agents cannot distinguish “no output” from “command failed silently” without this signal.
    - heading "6. Structured errors & exit codes" [level=4] [ref=e381]
    - paragraph [ref=e382]: "Mutations should be idempotent, errors should be structured and written to stdout (not stderr), and commands must never prompt for interactive input. Reserve stdout for structured data and stderr for debug/log output. Use clean exit codes: 0 for success, 1 for errors. Unknown flags must fail loud (exit 2) rather than be silently ignored — the same guarantee a CLI already gives for an unknown command — so an agent that invents a flag learns it did nothing instead of trusting unscoped output."
    - separator [ref=e383]
    - heading "Discoverability" [level=3] [ref=e384]
    - heading "7. Ambient context" [level=4] [ref=e385]
    - paragraph [ref=e386]: Install into the agent’s session hooks or plugin system from an explicit setup command so that every conversation starts with relevant state already visible — before the agent takes any action. The integration provides a compact, directory-scoped dashboard as initial context. As a secondary recommendation, also ship an installable Agent Skill (generated from the same home-view guidance) so agents that support the skill format can load your guidance on demand, without the per-session cost of a hook.
    - heading "8. Content first" [level=4] [ref=e387]
