        - "src/client.ts sends a Bearer token from src/credentials.ts, which takes HCLOUD_TOKEN and then the OS keychain entry for the selected context (HETZNER_AXI_CONTEXT, else the active one); the config file holds only context names (src/config.ts). Requests go only to the configured API origin and path, a non-https HETZNER_AXI_API_BASE outside localhost is refused, and 401, 403, 404, 409, 400/422, 429, and Hetzner's `protected`, `locked`, `uniqueness_error`, and `resource_limit_exceeded` codes map to AUTH_REQUIRED, FORBIDDEN, NOT_FOUND, CONFLICT, VALIDATION_ERROR, RATE_LIMITED, and PROTECTED with suggestions. `auth status` and `auth login` classify a token as read or read & write by sending an empty POST /ssh_keys and reading 403 versus 422 (src/commands/auth.ts). `action list` treats only a 404 from a collection's actions endpoint as empty, so a rejected token is AUTH_REQUIRED and an unreachable API NETWORK, both exit 1 (src/commands/catalog.ts). HETZNER_AXI_NO_KEYCHAIN=1 keeps the keychain unread and unwritten: `auth login` and `auth logout` of a stored context are refused as usage errors, and commands without HCLOUD_TOKEN fail AUTH_REQUIRED naming both variables."
        - "Each command noun has a --help block (also returned for `-h` anywhere in its arguments) with per-subcommand flag sets, including --no-wait/--wait and --fields, notes, and examples for every noun from `server` to `context` (src/cli.ts COMMAND_HELP). Next-step hints are pasteable: dynamic values are placeholders such as `<name>`, resource names that need it are shell-quoted, and every --confirm preview, `server list`'s --limit and --fields follow-ups, and the `api` GET --full rerun repeat the exact invocation with every token shell-quoted and --confirm or the changed flag added (src/render.ts rerunCommand); `firewall add-rule 'web edge' ... --description 'allow https'` previewed that same command plus --confirm. A missed lookup suggests the matching list command, `lb list` for load balancers (src/resources.ts findOne)."
        - "The no-argument home view (src/commands/home.ts) is live: headed by the SDK's `bin` and `description`, it prints `hetzner: not configured` with the login command and makes no keychain or network call until HCLOUD_TOKEN is set or a context is stored, prints `not authenticated` when no credential resolves, and otherwise shows the context, `server_count: N (n running; n off)`, and up to five servers with not-running ones first, under an 8-second timeout; a rejected token or unreachable API prints `hetzner: unavailable - ...` with exit 0. The session hooks run `hetzner-axi context` instead (src/commands/context.ts), which reads only the config file and the session log, never the API or the keychain, and prints bin, description, the stored contexts with the active or HETZNER_AXI_CONTEXT one marked, whether HCLOUD_TOKEN is set, the last session recorded for the working directory, and next commands, in about 940 characters and no Hetzner resource state; it exited 0 with a corrupt config file, a corrupt session log, or a malformed entry for the directory, which it skips."
        - "`setup hooks|status|uninstall [--project | --local]` (src/commands/setup.ts) writes the hooks through src/hooks.ts rather than the axi-sdk-js installer: Claude Code gets SessionStart `hetzner-axi context` and SessionEnd `hetzner-axi context end`, Codex a SessionStart hook plus `[features] hooks = true` in config.toml, and OpenCode a managed plugin whose default export carries `server` and `setup` entrypoints for OpenCode's two plugin loaders (not loaded in OpenCode for this review). The hook command is the bare name when PATH resolves to the same install and the shell-quoted absolute path otherwise. With a temporary HOME, setup wrote all three and a repeat left the files untouched; an install moved away showed `broken` in status until a rerun repaired it; v0.1.0's SDK hooks showed `outdated` and were replaced in place; setup from a source checkout or an npx-cache copy was refused (exit 2) without writing anything; and an unreadable ~/.claude/settings.json made both `setup hooks` and `setup uninstall` finish the other agents and then fail with SETUP_FAILED (exit 1) naming them, as did an OpenCode plugin that could not be removed, while `setup status` reported an unreadable hook file as `unreadable - ...` and an unreadable ~/.codex/config.toml as a note on the Codex line, both with exit 0, and a repeat uninstall reported each agent `not installed (no-op)`. `context end` reads the SessionEnd payload's transcript and records only command names, counts, and the valid HETZNER_AXI_CONTEXT value used most, per directory in sessions.json (mode 0600, latest 100 directories) (src/sessionlog.ts); a simulated transcript containing server names, IPs, and an unknown subcommand recorded `server list 1; server view 1; firewall add-rule 1; dns record set 1; api 1; other 1 - context staging`, which the next `context` in that directory showed as `last_session`. Codex and OpenCode get no session-end hook. README.md presents the hook and the skill as alternatives; skills/hetzner-axi/SKILL.md is generated by src/skill.ts through scripts/build-skill.ts with a 2000-character cap and a `build:skill -- --check` step in `pnpm run check`, which CI runs. Observations apply to the pinned wrapper source, not independently verified Hetzner Cloud API behavior."
  - name: mysql-axi
