        - packages/core/src/sessionlog.ts
        - packages/core/src/commands/home.ts
        - packages/core/src/commands/context.ts
        - packages/core/src/commands/common.ts
        - packages/core/src/commands/read.ts
        - packages/core/src/commands/auth.ts
        - packages/core/src/commands/doctor.ts
        - packages/core/src/commands/setup.ts
      source_observations:
        - "Tag v0.1.3 is 1c380ce2603aaa9be76bd5501752b243ea38531c, a version-bump-only commit on 664f30b72f05860f0a6557b32f9a0af9f461b140, the revision this review read and built, and npm's mysql-axi@0.1.3 records gitHead 1c380ce2603aaa9be76bd5501752b243ea38531c. packages/mysql-axi/package.json depends on @napi-rs/keyring, @toon-format/toon, axi-sdk-js ^0.1.13, and mysql2. packages/mysql-axi/bin/mysql-axi.ts answers -v/-V/--version through axi-sdk-js/fast-path with VERSION from the leaf src/version.ts before importing src/cli.ts, which hands only the shared READ_COMMANDS to runCli in packages/core/src/cli.ts; `update` (which would otherwise be the SDK's self-upgrade) and mysql-rw-axi's exec, import, and db are refusals that exit 2 with READ_ONLY and name the mysql-rw-axi command to use instead (observed). scripts/build.ts fails the build when the mysql-axi bundle contains a write-only marker (execCommand, importCommand, dbCommand, DROP DATABASE, singleStatement, loopbackOnly, ScriptSplitter) or when the mysql-rw-axi bundle lacks one."
        - "`query` and `explain` call assertReadOnly (packages/core/src/sql.ts) before resolving a connection. Its tokenizer drops comments and keeps quoted text opaque, and it refuses executable comments (`/*! */`), SET_VAR and RESOURCE_GROUP hints, more than one statement, a first verb outside SELECT/WITH/SHOW/DESC/DESCRIBE/EXPLAIN/TABLE/CHECKSUM TABLE, a WITH whose main verb is not SELECT/TABLE/VALUES, EXPLAIN of INSERT/UPDATE/DELETE/REPLACE, INTO/OUTFILE/DUMPFILE/LOCK/ANALYZE anywhere, FOR UPDATE/SHARE, and calls (quoted names included) to LOAD_FILE, SLEEP, BENCHMARK, the named-lock and replication-wait functions, and state-changing loadable functions; a statement must pass both with and without backslash escapes. Refusals are READ_ONLY with exit 2, observed for DELETE, two statements, INTO OUTFILE, `/*! */`, SET_VAR, a quoted `sleep`(1), WITH ... DELETE, FOR UPDATE, FOR SHARE, SET GLOBAL, and `explain` of an UPDATE."
        - "packages/core/src/connection.ts openSession runs every read, the no-argument live view, and the test connection of `auth login` with multipleStatements off, `SET SESSION transaction_read_only = ON` plus max_execution_time from --timeout (default 30 s, 1 to 3600), then START TRANSACTION READ ONLY, and ends the connection without COMMIT; MySQL error 1792 maps to READ_ONLY. In a throwaway mysql:8.0 container, a `query` of `SELECT bump()` as root, where bump() is a MODIFIES SQL DATA function that inserts a row, failed with READ_ONLY (exit 2) and inserted nothing. `doctor` reports `read_only_session: verified`, classifies SHOW GRANTS (packages/core/src/grants.ts), and for write-capable credentials or granted roles prints a warning that only the guard and the session block writes, plus a SELECT-only GRANT to use instead (observed); the package and CLI descriptions state that this is not a grant check."
        - "Passwords come only from `auth login --password-stdin` (a TTY or empty stdin is a usage error; nothing prompts) or MYSQL_AXI_URL, and are stored in the OS keychain through @napi-rs/keyring under the tool's own service name; config.json (mode 0600) holds only non-secret profile fields, MYSQL_AXI_NO_KEYCHAIN=1 disables the keychain, `auth login` connects before it saves so a typo never replaces a working profile, URL parse errors never echo the URL, and resolveTarget refuses a stored profile unlike what `auth login` writes (not an object, no user, no host or socket, or a mistyped field) as AUTH_REQUIRED before reading the keychain or connecting (packages/core/src/target.ts, packages/core/src/config.ts, packages/core/src/commands/auth.ts). IDENTIFIED BY and PASSWORD = literals in driver errors, statement snippets, and fenced output print as `<redacted>`, as do non-empty authentication_string and password columns (packages/core/src/secrets.ts, packages/core/src/cells.ts)."
        - "packages/core/src/render.ts encodes every block with @toon-format/toon and fences plans and SHOW CREATE text. `tables` rows default to name, kind, rows_est, and size (limit 200) with a `total: N tables; M views; <size>` line, `databases` rows are name, tables, and size (limit 100) with system schemas hidden and counted, and `query` shows 50 rows (max 1000), counting on to 1000 for `rows: 50 of N shown` or `of more than 1000 shown`; cells over 200 characters end in `... (+N chars; --full)`, blobs print `<blob N bytes>`, and empty results print `rows: 0` with the column names, `matches: none - ...`, `tables: none`, or `result: ok - no rows` (packages/core/src/commands/read.ts, packages/core/src/cells.ts). packages/core/src/args.ts rejects unknown flags per subcommand with the valid list and names replacements for carried-over flags (--db/--schema to --database, --password to --password-stdin, --yes/--force/--execute to --confirm), and treats missing, empty, repeated, or bad values and extra positionals as usage errors; formatError prints a TOON `error`/`code` block with help on stdout, exit 2 for VALIDATION_ERROR and READ_ONLY and 1 otherwise, and packages/core/src/errors.ts maps mysql2 errors to AUTH_REQUIRED, FORBIDDEN, NOT_FOUND, TIMEOUT, and NETWORK. Flags typed before a command move after the command and its arguments (observed for `-p wide tables -d shop`), flags alone run the live view, a single quoted SQL argument runs as `query`, and --help, -h, or --version before a command is refused by axi-sdk-js as a leading flag (exit 2)."
        - "The no-argument view (packages/core/src/commands/home.ts) resolves the target from -p, MYSQL_AXI_URL, or the active profile (reading the keychain only for a profile with a password) and opens the read-only session with a 3 s connect limit, 5 s per query, and a 10 s deadline. After bin, description, and the mode banner it prints the connection, `server: MySQL <version>` (noting a global read_only), then for the default or -d database `<db> - N tables; M views; <size>` with up to 20 table names and `+N more`, `no tables`, or `not found or not visible to this account`, and without a database the ten largest non-system databases (name, tables, size) with `Largest 10 of T shown` and the `databases` command (observed). A refused port, a listener that never answers (3.4 s), a wrong password, an invalid MYSQL_AXI_URL, or a hand-edited profile (`profile 'dev' in config.json has no user`) prints `live: unavailable - <why>` with a `doctor` hint and exits 0; an unknown profile or flag exits 2 (observed). Next-step hints are complete commands that keep the invocation's -p and -d, built by followUp and rerunHint in packages/core/src/commands/common.ts with POSIX shell quoting; observed after the live view, `databases`, `tables` without a database, `find`, `describe` of a missing table, a cut `query` (the same command with `--limit <total>`), and a TIMEOUT (`explain` with the same flags)."
        - "`setup hooks|status|uninstall [--project | --local]` (packages/core/src/commands/setup.ts, packages/core/src/hooks.ts) is the only path that writes hooks, and refuses to run from a source checkout or from an npx or pnpm dlx cache (exit 2, observed). It manages its own entries: Claude Code gets SessionStart `mysql-axi context` (timeout 10 s) and SessionEnd `mysql-axi context end` (30 s), Codex gets SessionStart in hooks.json plus `[features] hooks = true` in config.toml, and OpenCode gets a managed plugin that runs `context`; --local writes only .claude/settings.local.json and warns when git would commit it. The hook command is the bare name when PATH resolves to the running binary and the shell-quoted absolute path otherwise; a rerun rewrites a moved or 0.1.2-style command in place, keeps unrelated hooks, and prints `already up to date (no-op)` when nothing changed; `setup status` reports `broken`, `outdated`, or `unreadable` per agent and flags a Codex config.toml that is unreadable or has hooks off; and when one agent fails, install and uninstall finish the others and exit 1 with SETUP_FAILED naming what failed and what was done (all observed in an isolated HOME)."
        - "`mysql-axi context` (packages/core/src/commands/context.ts) prints the banner, the configured connection or profiles, and `last_session` for the current directory without connecting or reading the keychain, and exits 0, also with an invalid MYSQL_AXI_URL, an unreadable config, a hand-edited profile (listed as `invalid - <problem>`), or a sessions.json entry that `context end` would not have written (observed). `context end` reads the hook payload from stdin, and packages/core/src/sessionlog.ts counts this tool's commands in the transcript's shell tool calls plus the most used -p and -d, never SQL, keeping the latest summary for up to 100 directories in sessions.json (mode 0600); a transcript holding a URL password and SQL literals left none of them in the file (observed). packages/mysql-axi/skills/mysql-axi/SKILL.md is generated by packages/core/src/skill.ts through scripts/build-skill.ts as a stub capped at 2400 characters that defers to `npx -y mysql-axi`, `pnpm run check`, which CI runs, includes `build:skill -- --check`, and packages/mysql-axi/README.md presents the hook and the skill as alternatives with both install commands. Observations apply to the pinned source and its build; server behavior was checked only against throwaway mysql:8.0 containers."
