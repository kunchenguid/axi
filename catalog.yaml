        - "src/hass_axi/entry.py answers a bare `-v`, `-V`, or `--version` before anything else is loaded: it imports only `sys` and the package `__init__`, prints the bare version (0.10.0), and exits 0, and it imports src/hass_axi/cli.py only for any other invocation. cli.py prints the same bare line for a version flag in any other position and in every output mode, and loads each command module, the configuration loader, and the transports on first use."
        - "src/hass_axi/cli.py is the single error boundary: an AxiError renders as a structured `error`/`code`/`class`/`help` document on stdout with the error's exit code, and any other exception renders as INTERNAL_ERROR instead of a raw traceback. src/hass_axi/errors.py maps usage errors to exit 2 and every other failure to exit 1. src/hass_axi/argspec.py declares each subcommand's flags: an unknown flag is refused by name with the valid flags for that subcommand (UNKNOWN_FLAG, exit 2), and cli.py answers an unknown command or a missing subcommand with the valid ones. `<command> --help` prints that command's reference: its subcommands, each one's flags with defaults, notes, and examples."
        - "src/hass_axi/toon.py is an in-tree TOON encoder and src/hass_axi/output.py is the one output boundary: TOON by default with `--json` and `--human` modes, registered secrets redacted before anything reaches stdout or stderr, and `truncate` appending the original length. src/hass_axi/commands/state.py, service.py, and template.py truncate long attribute, description, and rendered-template text with a `--full` hint. List commands print shown, matched, and total counts with a larger-`--limit` suggestion; `entity list`, `device list`, `state list`, and `service list --domain` default to three fields and `statistics list`, `sensor list` (src/hass_axi/commands/sensor.py), `logbook get` (src/hass_axi/commands/logbook.py), and `area list` (src/hass_axi/commands/area.py) to four, with `--fields` selecting from the wider set and an unknown field name refused (UNKNOWN_FIELD, exit 2) before any request."
        - "`shorten` in src/hass_axi/commands/_common.py bounds the raw output of src/hass_axi/commands/api.py and src/hass_axi/commands/wscmd.py: every list keeps its first 25 items, every object its first 25 keys, and every string its first 1200 characters, and a result still over 20,000 characters has its nested containers replaced by counts. A `truncated` line says what was cut and the total size in characters, the `--full` hint is printed only when something was cut, and `--full` prints the whole response."
        - "src/hass_axi/readonly.py classifies every subcommand and declared WebSocket command as read, write, or dynamic, treats anything unclassified as a write, and refuses writes with READ_ONLY (exit 2) when HASS_AXI_READ_ONLY is non-empty; src/hass_axi/rest.py and src/hass_axi/ws.py enforce the same gate on their own transports, and src/hass_axi/ws.py classifies a `ws --raw` type no declaration names as a write. src/hass_axi/config.py takes the URL and token from the environment only (no token flag or credential file), and src/hass_axi/rest.py refuses a redirect that changes scheme or host instead of forwarding the Authorization header."
        - "One `--write` flag, declared in src/hass_axi/commands/_common.py, gates every command that changes Home Assistant: `service call` (service.py), an `api` request with any method but GET or HEAD (api.py), a `ws` command whose type is not a declared read (wscmd.py), and `entity update`, `area create`, `area update`, and `device update` (entity.py, area.py, device.py). Without it each prints `preview: nothing was sent to Home Assistant` with the request or the `would_change` from/to rows and exits 0; the `service call` preview reads the published service model and the registries and raises the errors the call itself would. A preview is classified as a read, so a read-only session can still see it. `setup hooks` and `setup skill` write local files and take no `--write`."
        - "src/hass_axi/commands/service.py pre-checks the capability a service publishes for area and device targets (UNSUPPORTED_CAPABILITY, with `--no-check` to send anyway), exits 1 with NO_ENTITIES_TARGETED when a target reached nothing, and explains a refused call from the service model (for example UNKNOWN_SERVICE_FIELD listing the accepted fields). src/hass_axi/commands/entity.py, area.py, and device.py report `already matches the requested values, no change made` for an update that already holds, and `area create` reports an existing area of the same name instead of failing."
        - "src/hass_axi/commands/home.py is the no-argument live view: executable path, description, entity counts by domain, unavailable and unknown counts, capped not-reporting, low-battery, and stale-sensor lists, and next-step help. With HA_URL/HA_TOKEN unset or Home Assistant unreachable it returns the same document with `live_state: not available - ...`, a `code` and `class`, the command names, and setup help, and src/hass_axi/cli.py exits 0 for it."
        - "src/hass_axi/hooks.py installs SessionStart and SessionEnd hooks for Claude Code and Codex (setting Codex's `[features] hooks`) and a managed OpenCode plugin only when `hass-axi setup hooks` runs (src/hass_axi/commands/setup.py), recording the bare binary name only when PATH resolves it to this executable; a repeat install reports each target current and a moved path is repaired. `setup hooks status` reports each target as installed, stale, or missing and writes nothing; `setup hooks remove` takes out only the entries this tool wrote, leaves Codex's features flag, and reports absent on a second run. The start hook runs `hass-axi context`, which src/hass_axi/commands/context.py writes to need no connection or credential and to exit 0."
        - "The session-end hook runs `hass-axi context end`. src/hass_axi/sessionlog.py reads the transcript the hook payload names (or, from the OpenCode plugin, which fires on session idle or deletion, the commands it passes), and records one entry per session: directory, date, a count per command name, and how many invocations carried `--write` - never an argument. `hass-axi context` prints the latest entry for the current directory as `last_session`. The skill is produced by `hass-axi setup skill` (src/hass_axi/skill.py), which generates skills/hass-axi/SKILL.md from the command table and has a `--check` mode for staleness; the committed copy is current at the pin."
        - "src/hass_axi/toolkit/ is an importable library surface the CLI is built on: names.py (case- and accent-folded matching, resolution that reports ties and near misses), shapes.py (entity-id and response-shape checks), and recorder.py (statistics summaries and their caveats). The three modules import only the standard library."
