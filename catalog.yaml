  # Admission review (independent source review per VISION.md): inspected
  # ardaatahan/vercel-axi at commit
  # 81c88e3582c3018fca8fcc1c4db40c993ece6f18 (no tagged release exists).
  # Direct source observations: src/commands/vercel.ts gates production
  # deploys, promote/rollback, domain add/remove, dns add/remove, and env
  # add/remove behind requireConfirm(), which throws UsageError absent
  # --confirm; src/output/errors.ts maps UsageError to exit 2 and AxiError
  # to exit 1 on the documented 0/1/2 taxonomy; src/vercel/process.ts wraps
  # the official `vercel` binary via spawnSync, converts a missing binary
  # or non-zero exit into a structured AxiError, and detects auth failures
  # to point at `vercel login`/VERCEL_TOKEN; env list redacts value/secret/
  # decryptedValue fields by default (vercel.ts redact()); src/index.ts
  # registers only these gated commands, with no ungated destructive path.
  # Verdict: the source-defined interface and behavior at that revision
  # satisfy the applicable AXI principles; admitted.
  - name: vercel-axi
    url: https://github.com/ardaatahan/vercel-axi
    author: ardaatahan
    domain: Deployment / Vercel
    description: "Deploy and inspect Vercel deployments, projects, domains, DNS, environment variables, and teams through the official Vercel CLI, with explicit confirmation gates for production and infrastructure changes."
  - name: cloudflare-axi
    url: https://github.com/simkimsia/cloudflare-axi
    author: simkimsia
    domain: Cloudflare
    description: "Inspect the current Worker's deployments, Pages projects, KV namespaces, and the logged-in account. Wraps the Cloudflare CLI (wrangler) with agent-ergonomic TOON output and structured errors."
  - name: coolify-axi
    url: https://github.com/radityasurya/coolify-axi
    author: radityasurya
    domain: Coolify
    description: "Apps, databases, services, and deployments on self-hosted or cloud Coolify - name-based addressing, redacted secrets, and TOON output over the official coolify CLI."
    admission:
      status: exception
      reviewed_revision: 513e9bb2d9addf35135c9fcdd8d7f57ce0de4a43
      reviewed_components:
        - bin/coolify-axi.js
        - src/cli.js
        - src/args.js
        - src/coolify.js
        - src/commands/app.js
        - src/commands/db.js
      source_observations:
        - "src/cli.js passes a `home` handler to runAxiCli that fetches `resource list` and returns counts, a state rollup, and per-resource state, so a no-argument run emits live data rather than the static TOON help in TOP_HELP."
        - "src/args.js parses each subcommand with node:util parseArgs in strict mode and converts ERR_PARSE_ARGS_UNKNOWN_OPTION into an AxiError with code VALIDATION_ERROR whose suggestion names that subcommand's valid flags."
        - "src/coolify.js runs the `coolify` binary through execFile and translates failures into AxiError codes MISSING_DEPENDENCY (ENOENT), AUTH_ERROR, NOT_FOUND, and COOLIFY_ERROR after dropping the wrapped CLI's update banner from stderr; redact()/redactValue() replace secret-named fields and the password segment matched by URL_CREDENTIALS in connection URLs unless --reveal is passed; resolveResource() raises VALIDATION_ERROR listing candidate uuids when a name matches more than one resource."
        - "src/commands/app.js projects `app get` through the DETAIL_FIELDS allow-list, truncates `app logs` to the last LOG_LIMIT (4000) characters with a size hint and a --full escape hatch, and returns `unchanged: true` without calling the wrapped CLI when start or stop targets a resource already in that state."
      exception: "`db get <name|uuid>` in src/commands/db.js returns a normal result payload reading `no database named <name>` for a lookup miss, so the process exits 0; the equivalent miss for applications, services, and servers goes through resolveResource() in src/coolify.js and raises a NOT_FOUND AxiError."
  - name: porkbun-axi
    url: https://github.com/ardaatahan/porkbun-axi
    author: ardaatahan
    domain: Domains / Porkbun
    description: "Manage Porkbun domains, DNS records, SSL certificates, URL forwarding, nameservers, and glue records through the Porkbun API, with compact TOON output and explicit confirmation gates for registrations and destructive updates/deletes."
    admission:
      status: exception
      reviewed_revision: 394fb206ea58c6d0aaa33a0f24bd6f70f84f206e
      reviewed_components:
        - src/commands/porkbun.ts
        - src/output/errors.ts
        - src/api.ts
        - src/cli/args.ts
        - src/index.ts
      source_observations:
        - "src/commands/porkbun.ts defines gate() which prints the change then throws UsageError unless --confirm is set; dns update/delete, forwarding delete, nameservers set, and glue update/delete call gate(); domains register uses its own --confirm check (not gate()), preflights checkDomain, then submits cost in cents with agreeToTerms only after --confirm; dns update refuses to run without --name."
        - "src/output/errors.ts maps UsageError to exit 2 and AxiError to exit 1 on the documented 0/1/2 taxonomy; src/cli/args.ts throws UsageError on unknown flags with the valid flag set for that command; src/index.ts registers only allCommands from porkbun.ts."
        - "src/api.ts reads PORKBUN_API_KEY and PORKBUN_SECRET_KEY from the environment into X-API-Key / X-Secret-API-Key headers (never the request body) and attaches a fresh Idempotency-Key UUID on idempotent writes; src/commands/porkbun.ts ssl retrieve prints PEM component sizes by default and only emits the certificate material with --json."
      exception: "`dns create`, `forwarding create`, and `glue create` in src/commands/porkbun.ts print a change line then POST the mutation; they do not take --confirm or call gate()."
