        - "src/args.ts rejects unknown flags and extra arguments by name as VALIDATION_ERROR, listing the command's valid flags; --limit and --skip must be whole numbers, and --limit is clamped to its maximum (100)."
        - "src/fireflies.ts runs the fireflies CLI with execFile (no shell), a 120 s timeout, and a 50 MB buffer, and never reads FIREFLIES_API_KEY itself. src/errors.ts maps the CLI's documented exit codes to AUTH, NOT_FOUND, VALIDATION_ERROR, WRITE_FAILED, API_ERROR, RATE_LIMITED, FIREFLIES_NOT_INSTALLED, and UNKNOWN; stdout is never relayed in an error, and relayed stderr is scrubbed by src/scrub.ts and capped at 200 characters."
        - "src/commands/home.ts is the no-argument view: the 5 most recent meetings (id, date, duration, title) with next-step hints, '0 meetings found' when empty, and a 'transcripts: status: unavailable' block with exit 0 when the CLI is missing, auth fails, or the API errors or rate-limits."
        - "src/commands/transcripts.ts lists 20 meetings by default (max 100) with four default columns, --fields organizer,participants checked against the allowed list, no invented total, and an exact --skip rerun hint on a full page. src/commands/transcript.ts shows one meeting with a 1,500-character preview, 300 characters per turn, and the first 10 participants unless --full; a missing id is refused rather than defaulting to the latest meeting. src/commands/download.ts saves via the CLI and re-stats the reported path, failing as WRITE_FAILED when it can't be read."
      exception: "Principle 7 has no lifecycle hooks: fireflies-axi ships a skill only (skills/fireflies-axi/SKILL.md) and installs no session-start or session-end hooks."
