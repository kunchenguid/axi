        - "Tag v0.1.1 is 087a324dce5720a96e277dfefad86fc37f2c690c, a version-bump-only commit on a1e6f166f304a1fb498054f0146773fc79f01aae (the reviewed source) and the gitHead of the published npm 0.1.1; package.json carries version 0.1.1 with dependencies @napi-rs/keyring, @toon-format/toon, and axi-sdk-js (0.1.12 in pnpm-lock.yaml). bin/hetzner-axi.ts answers -v/-V/--version through axi-sdk-js/fast-path with VERSION from the leaf src/version.ts before importing src/cli.ts, which runs every command through runAxiCli with one formatError that renders an AxiError (or any other error as UNKNOWN) as a TOON `error`/`code` block plus help lines on stdout, with the exit code from axi-sdk-js exitCodeForError."
