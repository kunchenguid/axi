      source_observations:
        - "Tag v0.1.3 is 1c380ce2603aaa9be76bd5501752b243ea38531c, a version-bump-only commit on 664f30b72f05860f0a6557b32f9a0af9f461b140, the revision this review read and built, and npm's mysql-rw-axi@0.1.3 records gitHead 1c380ce2603aaa9be76bd5501752b243ea38531c. packages/mysql-rw-axi/package.json depends on @napi-rs/keyring, @toon-format/toon, axi-sdk-js ^0.1.13, and mysql2. packages/mysql-rw-axi/bin/mysql-rw-axi.ts answers -v/-V/--version through axi-sdk-js/fast-path with VERSION from the leaf src/version.ts before importing packages/mysql-rw-axi/src/cli.ts, which registers exec, import, and db ahead of the shared packages/core READ_COMMANDS (find, databases, tables, describe, sample, query, explain, doctor, auth, setup) under its own config directory, keychain service, and MYSQL_RW_AXI_* variables (packages/core/src/tool.ts), and refuses `update`, which would otherwise be the SDK's self-upgrade, as VALIDATION_ERROR with exit 2 (observed)."
        - "packages/mysql-rw-axi/src/loopback.ts is the tool's checkTarget, which resolveTarget in packages/core/src/target.ts applies to every command that connects, reads, `doctor`, and the no-argument view included, and which `auth login` applies before its test connection. Unix sockets pass; a host passes only when every address from dns lookup (all: true) is in 127.0.0.0/8, ::1, or ::ffff:127.x, otherwise FORBIDDEN (exit 1) before any connection, with no flag or environment override. The connection then goes to the first checked 127.x address, or else the first checked address, so on macOS a `localhost` that resolves to ::1 and 127.0.0.1 reached a container published on 127.0.0.1 only, and 192.0.2.10 was refused for `exec` and `query` (observed). The banner, top-level help, and skill warn that an SSH tunnel to 127.0.0.1 also counts as loopback."
        - "Read commands run the shared core path: assertReadOnly before connecting, then a session with multipleStatements off, `transaction_read_only = ON`, and START TRANSACTION READ ONLY (packages/core/src/sql.ts, packages/core/src/connection.ts), which the no-argument view also uses; a `query` of an UPDATE is refused as READ_ONLY with exit 2 and the hint `Writes go through` followed by `mysql-rw-axi exec \"<sql>\"` with the invocation's -p and -d (observed). Only exec, import, and db open writable sessions."
        - "packages/mysql-rw-axi/src/commands/exec.ts takes exactly one statement (packages/mysql-rw-axi/src/classify.ts singleStatement; a CREATE PROCEDURE/FUNCTION/TRIGGER/EVENT body counts as one, and more statements are refused with an `import <file.sql>` hint that keeps -p and -d) and classifies it before connecting: DROP, TRUNCATE, DELETE or UPDATE without WHERE, REPLACE, LOAD DATA ... REPLACE, and ALTER ... DROP other than DROP DEFAULT print a `preview` with the statement, risk, and target and run nothing until --confirm, and the preview's hint is the same command with its flags plus --confirm (observed). Other statements, and confirmed ones, run in a writable session with no time limit and report verb, affected_rows, matched_rows, insert_id, and SHOW WARNINGS rows; with CLIENT_FOUND_ROWS off, a repeated UPDATE reports `affected_rows: 0` (observed), and a statement that returns rows prints the capped result table."
        - "packages/mysql-rw-axi/src/commands/db.ts checks the name (letters, digits, `_`, `$`, `-`) and the --charset/--collation values and refuses the four system schemas before connecting. `db create` of an existing database prints `already exists (no-op)`; `db drop` previews DROP DATABASE with the table count and size until --confirm and prints `does not exist (no-op)` when the database is absent, all with exit 0, and the follow-up hints keep -p (`db drop <name> -p <profile> --confirm`, `import <file.sql> -d <name> -p <profile>`) (observed)."
        - "packages/mysql-rw-axi/src/commands/import.ts reads the script, or stdin spooled to a temp file, in 1 MiB chunks through packages/mysql-rw-axi/src/script.ts, a quote-, comment-, and DELIMITER-aware splitter, and scans it before writing: USE or CREATE DATABASE of a system schema is refused, a script that switches away from -d with USE (a `mysqldump --databases` file) is refused unless --skip-use or --follow-use is given, irreversible statements preview (first five, plus a count) with the statement total, target, and `writes_to` until --confirm, and DEFINER accounts missing from mysql.user are named when the account can read it. Statements then run with autocommit, and the first failure stops the run with the statement number, a redacted snippet, and the count already applied. Observed: a script starting with `USE other_db` was refused with -d (both suggested reruns keep -p and -d), previewed with --skip-use, and loaded into the -d database with --skip-use --confirm."
        - "Output, parsing, errors, and secrets are the shared packages/core code: TOON blocks with fenced raw text, strict per-subcommand flags with rename hints (--yes/--force/--execute to --confirm), stdout errors with exit 2 for VALIDATION_ERROR and READ_ONLY and 1 otherwise, passwords taken only from stdin or MYSQL_RW_AXI_URL and kept in the OS keychain, a hand-edited profile refused as AUTH_REQUIRED before the loopback check or any connection (observed: `exec` with a profile that has no user ran nothing), and 200-character cell truncation with `--full`. The no-argument view (packages/core/src/commands/home.ts) prints `warning: WRITE-CAPABLE ...`, the loopback scope, and a note that reads stay read-only, then, after the loopback check and through the read-only session with 3 s, 5 s, and 10 s limits, the connection, the server, and the default database's tables or the largest databases, with hints that keep -p and -d and end with the `exec` command (observed); a non-loopback target prints `live: unavailable - refusing host ...` and exits 0 (observed)."
        - "`setup hooks|status|uninstall [--project | --local]` and `context` are the shared packages/core/src/commands/setup.ts, packages/core/src/hooks.ts, packages/core/src/commands/context.ts, and packages/core/src/sessionlog.ts under mysql-rw-axi's own names: Claude Code gets SessionStart `mysql-rw-axi context` and SessionEnd `mysql-rw-axi context end`, Codex and OpenCode get session start only, and the per-agent SETUP_FAILED handling, path repair, and no-op reruns are the same code as mysql-axi's; `setup hooks --local` in a temporary git repository wrote both entries to .claude/settings.local.json with the git warning, reported `already up to date (no-op)` on a repeat, and `setup uninstall --local` removed them (observed). `mysql-rw-axi context` starts with the WRITE-CAPABLE warning and the loopback scope, never connects or reads the keychain, and exits 0. packages/mysql-rw-axi/README.md offers `setup hooks --local` or the skill (`npx skills add cmosgh/mysql-axi --skill mysql-rw-axi`) as alternatives, only where writing is wanted, and says to allow `Bash(mysql-rw-axi:*)` only there; packages/mysql-rw-axi/skills/mysql-rw-axi/SKILL.md is generated from packages/mysql-rw-axi/src/skill.ts with a write warning and defers to `npx -y mysql-rw-axi`, and `pnpm run check`, which CI runs, includes `build:skill -- --check`. Observations apply to the pinned source and its build; server behavior was checked only against throwaway mysql:8.0 containers."
