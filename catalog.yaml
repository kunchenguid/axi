      source_observations:
        - "Tag v0.1.1 is 5112076abc4a6524dc517a7065b5a5cd96753f40, a version-bump-only commit on 43ff7832f036b2c78e4f41e2464921d24cfaa87f. packages/mongo-rw-axi/package.json carries version 0.1.1 with the same five dependencies as mongo-axi, the private packages/core is bundled in by scripts/build.ts, and the dist of the npm 0.1.1 tarball (gitHead 5112076abc4a6524dc517a7065b5a5cd96753f40) is byte-identical to a build of the tag. packages/mongo-rw-axi/bin/mongo-rw-axi.ts answers -v/-V/--version through axi-sdk-js/fast-path with VERSION from the leaf packages/mongo-rw-axi/src/version.ts, and packages/mongo-rw-axi/src/cli.ts registers insert, update, delete, import, index, collection, and db ahead of the shared read commands (its `update` is the document command, not the SDK's self-upgrade), with checkTarget set to loopbackOnly and checkServer to notATunnel. Argument parsing, leading-flag hoisting, structured errors on stdout, and exit codes are the shared packages/core code (args.ts, errors.ts, cli.ts); --yes, --force, and --execute get a hint to --confirm."
        - "packages/mongo-rw-axi/src/loopback.ts loopbackOnly runs from resolveTarget (packages/core/src/target.ts) and from `auth login` before any connection, for read commands, write commands, and the no-argument overview alike: it refuses mongodb+srv, more than one host, loadBalanced=true, any proxy option, and tls or ssl=true, resolves the one host and refuses it unless every address is in 127.0.0.0/8 or ::1 (a path ending in .sock passes), then rewrites the URI to the checked address with directConnection=true; no flag or environment variable overrides it. With the built CLI, connection strings naming 10.1.2.3, an SRV string, a two-host seed list, tls=true, loadBalanced=true, and proxyHost each failed with FORBIDDEN (exit 1) before connecting, and the overview reported the 10.1.2.3 profile as `live: unavailable - refusing host '10.1.2.3' ...` with exit 0 and no connection."
        - "After connecting, openSession (packages/core/src/connection.ts) runs notATunnel, which reads hello and refuses the server as FORBIDDEN when a listed host, passive, or arbiter is a non-loopback IP, resolves to one, or is a dotted name that does not resolve; localhost, *.localhost, host.docker.internal, and single-label container names pass. A throwaway mongo:8.0 replica set on a loopback port, whose member was the container IP, was refused for `insert --create` (nothing was written) and shown by the overview as `live: unavailable`. A tunnel to a standalone server or a mongos is not detectable, as the README states."
        - "write() in packages/mongo-rw-axi/src/commands/common.ts runs every write command with writeWireGuard (packages/mongo-rw-axi/src/write-guard.ts) in the same commandStarted listener: it adds only insert, update, delete, create, drop, dropDatabase, createIndexes, dropIndexes, and renameCollection to the read allowlist, never on the admin, local, or config databases or system.* collections (both sides of a rename), and walks update q and u, delete q, and create pipeline and validator for server-side JavaScript, $out, $merge, and Code. assertNoCode, assertWritable, and newNamespace apply the same rules before connecting, and read commands keep read() with readWireGuard, so `aggregate` with $out or $merge is refused as READ_ONLY. packages/mongo-rw-axi/src/shell-write.ts maps insertOne, insertMany, updateOne, updateMany, replaceOne, deleteOne, deleteMany, createIndex, dropIndex, drop, and renameCollection onto the same functions and names a replacement for findOneAndUpdate, bulkWrite, and the legacy methods."
        - "--confirm gates (packages/mongo-rw-axi/src/commands/docs.ts, admin.ts, import.ts): update --many and delete --many preview when countDocuments shows the filter matches every document of a non-empty collection, and index drop, collection drop, db drop, rename onto an existing name, and import --drop onto an existing collection always preview. A preview exits 0, says nothing was changed, and gives the exact command with --confirm added (Run `mongo-rw-axi 'db.items.deleteMany({})' --confirm` to run it), which ran as given. Repeats converge with exit 0: collection create, index create on the same keys, drops of a missing index, collection, or database, a repeated update or delete, `collection rename a b` once a is gone and b exists (`already renamed (no-op)`), and an insert whose _id already holds the same document (`unchanged: 1 (same _id and content - no-op)`, compared as relaxed Extended JSON with _id first, in insertDocuments in common.ts). An _id that holds different content fails WRITE_ERROR (exit 1) naming the _id, with an `update <collection> '{_id: ...}' '<document>' --replace` hint; insert refuses a missing collection with near names unless --create, and documents without _id are inserted again on a rerun, as the help says."
        - "Read commands, output, truncation, counts, hints, and empty states are the shared packages/core code described for mongo-axi (TOON, 20 documents by default, `docs: N of M shown`, 200-character strings with --full, explicit zero states, NOT_FOUND for a missing collection, -p and -d carried into next steps). import parses the whole JSON array or JSON Lines input (files up to 256 MB) before connecting, then sends unordered batches (--batch, default 1000) through the same insertDocuments: a document whose _id already holds the same content is counted as unchanged, so a rerun of an import of documents with _id is a no-op (25 unchanged, exit 0), and the first batch with a conflict or another failure stops the import as WRITE_ERROR with the counts, the number of documents not sent, and the rerun command. Profiles, keychain entries, the session log, and MONGO_RW_AXI_* variables are separate from mongo-axi's (packages/core/src/config.ts, packages/core/src/target.ts)."
        - "The no-argument view (packages/core/src/commands/home.ts) prints `bin`, `description`, the WRITE-CAPABLE warning, the loopback scope, and a line saying reads stay read-only, then the same live overview as mongo-axi (server, then collections or the largest databases) through loopbackOnly, notATunnel, and readWireGuard, or `live: unavailable - <reason>` with exit 0, with a hint naming the write commands; `mongo-rw-axi context` is the offline summary with the same warning and scope. setup is the shared packages/core/src/commands/setup.ts and hooks.ts (SessionStart `mongo-rw-axi context` for Claude Code, Codex, and OpenCode, SessionEnd `mongo-rw-axi context end` for Claude Code, or Claude Code only with --local), matched by the mongo-rw-axi binary name so mongo-axi's hooks are left alone. The README recommends installing either only where writing is wanted (`setup hooks --local`) and presents the hook and `npx skills add cmosgh/mongo-axi --skill mongo-rw-axi` as alternatives of which the user needs one; packages/mongo-rw-axi/skills/mongo-rw-axi/SKILL.md is a generated stub with a write warning and `npx -y mongo-rw-axi` commands, checked by `build:skill -- --check`. Observations apply to the pinned source and its built CLI, not to independently verified MongoDB server behavior."
