        - packages/core/src/commands/common.ts
        - packages/core/src/commands/browse.ts
        - packages/core/src/commands/query.ts
        - packages/core/src/commands/shell-form.ts
        - packages/core/src/commands/doctor.ts
        - packages/core/src/commands/auth.ts
        - packages/core/src/commands/setup.ts
        - scripts/build.ts
        - scripts/build-skill.ts
        - scripts/sync-version.ts
        - .github/workflows/ci.yml
      source_observations:
        - "Tag v0.1.1 is 5112076abc4a6524dc517a7065b5a5cd96753f40, a version-bump-only commit on 43ff7832f036b2c78e4f41e2464921d24cfaa87f. packages/mongo-axi/package.json carries version 0.1.1 with dependencies axi-sdk-js, mongodb ~6.16.0, mongodb-connection-string-url, @napi-rs/keyring, and @toon-format/toon; the private packages/core is bundled in by scripts/build.ts, and the dist of the npm 0.1.1 tarball (gitHead 5112076abc4a6524dc517a7065b5a5cd96753f40) is byte-identical to a build of the tag. packages/mongo-axi/bin/mongo-axi.ts answers -v/-V/--version through axi-sdk-js/fast-path with VERSION from the leaf packages/mongo-axi/src/version.ts (node builtins only) before importing the CLI, and packages/core/src/cli.ts runs every command through runAxiCli with errors as a TOON `error`/`code` block plus help lines on stdout, exiting 2 for VALIDATION_ERROR and READ_ONLY and 1 otherwise (packages/core/src/errors.ts). It replaces axi-sdk-js's built-in `update` self-upgrade with a refusal, and in mongo-axi `update`, `insert`, `delete`, `import`, `index`, `collection`, and `db` answer READ_ONLY (exit 2) with the matching mongo-rw-axi command, or `npm install -g mongo-axi@latest` for an upgrade (packages/mongo-axi/src/cli.ts)."
        - "packages/core/src/args.ts is a strict per-command parser: an unknown flag fails as VALIDATION_ERROR (exit 2) with the command's valid flags inline, with targeted hints for carried-over flags (--query, --where, and --match to --filter; --projection and --fields to --project; --db to --database; --password to --password-stdin) and for --collection or --pipeline where a positional belongs. Missing, empty, and repeated values, extra positionals, unknown --fields names, and out-of-range numbers are usage errors raised before a target is resolved. hoistLeadingFlags in packages/core/src/cli.ts moves flags typed before the command to after the command and its arguments but before a `--`, and runs flags given without a command (`mongo-axi -p staging -d shop`) as the overview; `auth login --password-stdin` refuses a TTY stdin instead of prompting (packages/core/src/commands/auth.ts)."
        - "Before connecting: packages/core/src/literal.ts reads JSON, Extended JSON v2, and mongosh literals (ObjectId, ISODate, NumberDecimal, /re/i, unquoted keys) into BSON values without evaluating anything, and refuses Code, Function, and $code values, duplicate keys, nesting past 100 levels, and input over 1,000,000 characters; packages/core/src/shell.ts parses `db.<collection>.find(...).sort(...)` the same way, so a function or a second statement is a syntax error. assertReadInput in packages/core/src/guard.ts walks the parsed input at every depth and refuses, in any letter case, $out, $merge, $where, $function, $accumulator, $changeStream, any `$_` key, and BSON Code, and refuses system.users and system.keys as the target or as a $lookup, $graphLookup, or $unionWith source, as READ_ONLY (exit 2); shell-form write methods such as deleteMany and drop are refused the same way with a pointer to mongo-rw-axi (packages/core/src/commands/shell-form.ts)."
        - "On the wire: openSession in packages/core/src/connection.ts sets monitorCommands and a commandStarted listener that throws on a refusal; mongodb 6.16 emits that event synchronously in Connection.sendCommand before the socket write, so a refused command is not sent. readWireGuard allows only find, getMore, killCursors, aggregate, count, distinct, explain of those four, listDatabases, listCollections, listIndexes, dbStats, collStats, buildInfo, connectionStatus, ping, hello/isMaster, and endSessions; it walks pipeline, filter, query, projection, sort, and let again, refuses the credential collections, and requires a numeric maxTimeMS on find, aggregate, count, and distinct, inside explain too. read() in packages/core/src/commands/common.ts applies it to every read command with a 30 s default (--timeout 1 to 3600), the no-argument overview opens its session with it too, and `doctor` sends getParameter on each run and reports `wire_guard: verified` only when it was stopped (packages/core/src/commands/doctor.ts), which it did against a throwaway mongo:8.0."
        - "In the package: scripts/build.ts fails the build when the mongo-axi bundle contains a driver write call (`.insertMany(`, `.deleteMany(`, `.drop(`, `.createIndex(`, `.rename(`, `.dropDatabase(` and others) or the write-tool names loopbackOnly and WRITE_WIRE_COMMANDS, or when a package's dependencies differ from its imported externals; `pnpm run check`, run in .github/workflows/ci.yml, includes that build. The account's roles remain the only server-side check: `doctor` lists the user, roles, and every non-read privilege action and warns when the credentials can write or the server has no access control, and the README says the tool is not a role check."
        - "Output is TOON through packages/core/src/render.ts, with query plans and validators between `---` fences. packages/core/src/values.ts prints typed values in mongosh form, cuts strings at 200 characters, arrays at 20 items, and nesting at depth 8 with size notes such as `(+200 chars; --full)`, and prints keys named password, pwd, or credentials as `<redacted>`. find and aggregate return 20 documents by default (max 1000) and a cut result prints `docs: 3 of 40 shown` with an exact total up to 1000; collections rows are name, kind, docs, and size with --fields extras; describe reports path, types, and percent present from a $sample of 100; indexes adds $indexStats ops. Empty results print `docs: 0`, `count: 0`, or `matches: none - ...`, and a missing collection is NOT_FOUND with near names. Hints come from packages/core/src/hints.ts: followUp carries the invocation's -p and -d into next-step commands (`collections -p other -d shop` suggests `mongo-axi describe <collection> -p other -d shop`), and rerunHint gives a cut result its exact rerun, shell-quoted (Run `mongo-axi find orders '{status: \"paid\"}' -p other -d shop --limit 40` to see all), falling back to a plain instruction when the command is over 300 characters or contains a connection-string password."
        - "The no-argument view (packages/core/src/commands/home.ts) prints `bin` (home directory as ~), `description`, and the READ-ONLY mode line, then connects with short limits (3 s server selection and connect, 8 s socket, retryReads off, 10 s overall) and shows `server: MongoDB <version> - standalone`, `replica set <name> (<role>)`, or `sharded cluster (mongos)`, then the default database's collection and view counts, size, and up to 20 collection names with `+N more`, or the ten largest databases with `Largest 10 of N shown`. Without a configuration it prints `status: not configured` and login help without connecting; a connection failure prints `live: unavailable - <reason>` with a `doctor` hint and exit 0 (an unknown profile or flag typed with it still exits 2). `mongo-axi context` (packages/core/src/commands/context.ts) is the offline session summary: the same header, the MONGO_AXI_URL target and the profiles from the config file, the last session recorded for the current directory as `last_session`, and command hints, about 1,150 bytes, with no network or keychain access."
        - "`setup hooks|status|uninstall [--project | --local]` (packages/core/src/commands/setup.ts, packages/core/src/hooks.ts) is the only path that writes agent config: a SessionStart hook running `mongo-axi context` for Claude Code, Codex (also setting `[features] hooks = true` in ~/.codex/config.toml), and OpenCode (a managed plugin), plus a Claude Code SessionEnd hook running `mongo-axi context end`; Codex and OpenCode get no session-end hook, and --local writes only Claude Code's .claude/settings.local.json. The hook names the bare binary when PATH resolves it to the running install and the absolute path otherwise; a rerun rewrites a moved or v0.1.0 hook in place and is otherwise a no-op, `status` reports `broken` or `outdated` hooks and unreadable agent files with exit 0, only entries whose binary is this tool running `context` are touched (a hand-written `mongo-axi databases` hook was kept and uninstall restored the settings file exactly), an agent that fails during install or uninstall ends the run as SETUP_FAILED (exit 1) naming the agents that went through, and setup refuses (exit 2) from an npx or pnpm dlx cache or a tsx source checkout. `context end` (packages/core/src/sessionlog.ts) reads the transcript named in the hook payload and keeps, per directory (realpath, latest 100), the date, a count per command name, and the most-used -p and -d values in ~/.config/mongo-axi/sessions.json (mode 0600); an unknown first word counts as `other`, so filters and other arguments are never recorded, a payload it cannot use records nothing with exit 0, and `context` skips a log or entry of the wrong shape. The README's Agent integration section presents the hook and `npx skills add cmosgh/mongo-axi --skill mongo-axi` as alternatives of which the user needs one; packages/mongo-axi/skills/mongo-axi/SKILL.md is a generated stub (scripts/build-skill.ts, packages/core/src/skill.ts) with `npx -y mongo-axi` commands, and `pnpm run check` runs `build:skill -- --check`. Observations apply to the pinned source and its built CLI, not to independently verified MongoDB server behavior."
