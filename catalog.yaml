      source_observations:
        - "-v, -V, and --version print the bare version (or {\"version\":...} with --json) and exit 0, and --help prints help, both before any host lookup or miner request; unknown flags, unknown commands, repeated flags, missing values, and flags of another command are usage errors with exit 2 that print the valid flags and commands on stdout (internal/app/app.go, cmd/axeos-axi/main.go)."
        - "Reads are GET requests to /api/system on the miner for info, asic, statistics (with a columns query), firmware/checksum, scoreboard, and logs; `logs --follow` opens a read-only WebSocket at /api/ws on the miner; `firmware --check-release` sends one HTTPS GET without token or cookie to the GitHub releases API for bitaxeorg/ESP-Miner, the only request that leaves the local network; `discover` sends only mDNS queries and contacts no miner API; `host save` sends one GET /api/system/info and writes the local host file; the only write requests are POST /api/system/restart and PATCH /api/system for frequency, coreVoltage, and pools; miner requests follow no redirect and ignore proxy variables (internal/axeos/client.go, internal/ws/ws.go, internal/app/logs_follow.go, internal/app/release.go, internal/release/release.go, internal/app/discover.go, internal/mdns/browse.go, internal/app/host.go)."
        - "restart, tuning, and pool send no write request without --confirm and print the host, request, effect, and exact execute command; the tuning and pool previews read info (and asic for tuning) to print present and new values, and a multi-host restart preview reads info from each miner; with --confirm each sends exactly one write request per miner; tuning refuses values outside the lists the miner reports, pool checks fixed format rules for URL, port, and user, failures are *_not_sent, *_unconfirmed, or *_failed with exit 1, and tuning and pool print a restore command; a confirmed pool --user requires --show-user (internal/app/restart.go, internal/app/tuning.go, internal/app/pool.go, internal/app/writes.go, internal/app/app.go)."
        - "Several --host values are checked first with reads; if any miner fails the check no write is sent, otherwise writes go one after the other and stop at the first failure, with later rows not_attempted (internal/app/writes.go)."
        - "logs prints only total_lines and size_bytes by default and has an explicit `0 lines in the miner log buffer` empty state; --lines is opt-in and replaces the pool user, MAC, and Wi-Fi name reported by info unless --show-private is given (internal/app/logs.go)."
        - "skill install writes the embedded SKILL.md to ~/.agents/skills/axeos-axi/SKILL.md or under --path through a temporary file and rename, reports written, and writes nothing when the content is identical; it needs no host and registers nothing automatically (internal/app/skill.go, internal/skill/skill.go)."
      exception: "No `setup hooks` (or other session-integration) command exists, so principle 7's session integration is not offered and only the skill half is covered by `axeos-axi skill install`. Observations apply to the pinned wrapper source, not to AxeOS firmware behavior or a real miner."
